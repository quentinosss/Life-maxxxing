<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Life Maxxxing">
<meta name="theme-color" content="#F3F5F8">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Life Maxxxing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout : une colonne mobile, onglets en bas, la journée comme une fiche à remplir de haut en bas */
:root {
  --bg: #F3F5F8;
  --surface: #FFFFFF;
  --ink: #17202C;
  --muted: #5F6B7A;
  --line: #DCE1E8;
  --accent: #D9472B;
  --accent-soft: #FBE6E1;
  --good: #2E8B57;
  --good-soft: #E1F2E8;
  --warn: #B7791F;
  --font-display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --surface: #1A212B; --ink: #E8ECF1; --muted: #9AA6B4; --line: #2B3542;
    --accent: #F06A4C; --accent-soft: #3A221D; --good: #4FBF83; --good-soft: #1C3328; --warn: #E0A84A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161D; --surface: #1A212B; --ink: #E8ECF1; --muted: #9AA6B4; --line: #2B3542;
  --accent: #F06A4C; --accent-soft: #3A221D; --good: #4FBF83; --good-soft: #1C3328; --warn: #E0A84A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font: 800 22px/1.1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
h1 span { color: var(--accent); }
h2 { font: 700 13px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 10px; }
.save-state { font-size: 12px; color: var(--muted); text-align: right; }
.save-state.dirty { color: var(--warn); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.datebar { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; }
.datebar button { height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; }
.datebar .label { text-align: center; }
.datebar .label strong { display: block; font: 700 17px var(--font-display); text-transform: capitalize; }
.datebar .label small { color: var(--muted); }
.scoreline { display: flex; align-items: center; gap: 14px; }
.ring { width: 64px; height: 64px; flex: none; }
.scoreline .big { font: 800 30px/1 var(--font-display); font-variant-numeric: tabular-nums; }
.scoreline p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; padding-top: 0; }
.row .name { display: flex; flex-direction: column; }
.row .name small { color: var(--muted); font-size: 12px; }
.toggle { min-width: 64px; height: 36px; border-radius: 18px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 13px; }
.toggle[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.stepper output { min-width: 58px; text-align: center; font: 600 15px var(--font-body); font-variant-numeric: tabular-nums; }
.stepper output.ok { color: var(--good); }
.stepper output.bad { color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 500; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.mood { display: flex; gap: 8px; }
.mood button { flex: 1; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; }
.mood button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
textarea, input[type="text"], input[type="date"], input[type="number"] { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 9px 10px; color: var(--ink); }
textarea { resize: vertical; min-height: 44px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.savebar { position: fixed; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; padding: 0 16px; pointer-events: none; }
.savebar button { pointer-events: auto; max-width: 528px; width: 100%; height: 48px; border: 0; border-radius: 12px; background: var(--accent); color: #fff; font: 700 15px var(--font-display); box-shadow: 0 6px 18px rgba(0,0,0,0.18); }
.savebar button:disabled { background: var(--line); color: var(--muted); box-shadow: none; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom)); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
nav.tabs a { display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 12px; }
nav.tabs a[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
.view[hidden] { display: none; }
table.week { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; }
table.week th, table.week td { padding: 6px 2px; text-align: center; border-top: 1px solid var(--line); }
table.week th:first-child, table.week td:first-child { text-align: left; color: var(--muted); font-weight: 500; }
table.week thead th { border-top: 0; color: var(--muted); font-weight: 600; }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--line); }
.dot.on { background: var(--good); }
.dot.off { background: var(--accent); }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font: 800 24px/1.15 var(--font-display); font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12px; color: var(--muted); }
.streak { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); }
.streak:first-of-type { border-top: 0; }
.pill { padding: 3px 10px; border-radius: 12px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--accent-soft); color: var(--accent); }
.btn { height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; padding: 0 14px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 90px; margin-top: 6px; }
.bars div { background: var(--good); border-radius: 4px 4px 0 0; min-height: 2px; }
.bars div.empty { background: var(--line); }
.barlabels { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 11px; color: var(--muted); text-align: center; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font: 10px var(--font-body); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.hbar { display: grid; grid-template-columns: 110px 1fr 42px; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
.hbar .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; border-radius: 5px; }
.hbar b { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.seg5 { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.seg5 button { flex: none; height: 36px; padding: 0 12px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px; }
.seg5 button[aria-pressed="true"], .seg3 button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.seg3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg3 button { height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 600; font-size: 13px; }
select { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 9px 8px; color: var(--ink); font: inherit; }
.kv { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.kv:first-of-type { border-top: 0; }
.kv b, .bhead b, .txr b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.bline, .fund { padding: 8px 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.bline:first-of-type, .fund:first-of-type { border-top: 0; }
.bhead { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
.fill { height: 100%; border-radius: 5px; }
.txrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.txrow:first-of-type { border-top: 0; }
.txrow .name { display: flex; flex-direction: column; min-width: 0; }
.txrow .name small { color: var(--muted); font-size: 12px; }
.txr { display: flex; align-items: center; gap: 8px; }
.mini { height: 30px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; font-weight: 600; }
.mini.danger { color: var(--accent); }
.check { display: flex; align-items: center; gap: 8px; font-size: 14px; align-self: end; height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
.fundact { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.okmsg { color: var(--good); font-weight: 600; font-size: 13px; }
.linkbtn { display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--ink); font-size: 13px; }
.btn:disabled { opacity: .5; }
@media (prefers-reduced-motion: no-preference) { .toggle, .chip, .stepper button { transition: background .15s, color .15s; } }
</style>
</head>
<body>
<script id="lm-state" type="application/json">{"settings":{"start":"2026-11-09","prices":{"paquet":13,"joint":3,"verre":4,"sodaL":1.5,"cafe":1.5},"base":{"cig":10,"joints":3.5,"alcool":1.8,"soda":66,"cafe":3}},"days":{}}</script>
<div class="wrap">
  <header class="top">
    <h1>Life Max<span>xxx</span>ing</h1>
    <div class="save-state" id="saveState">À jour</div>
  </header>

  <section class="view" id="view-jour"></section>
  <section class="view" id="view-semaine" hidden></section>
  <section class="view" id="view-stats" hidden></section>
  <section class="view" id="view-sevrage" hidden></section>
  <section class="view" id="view-budget" hidden></section>
  <section class="view" id="view-reglages" hidden></section>
</div>


<nav class="tabs" aria-label="Sections">
  <a href="#jour" data-view="jour">Jour</a>
  <a href="#semaine" data-view="semaine">Semaine</a>
  <a href="#stats" data-view="stats">Stats</a>
  <a href="#budget" data-view="budget">Budget</a>
  <a href="#reglages" data-view="reglages">Réglages</a>
</nav>

<script>
(function () {
  const DATA_KEY = "lm-data";
  let state = JSON.parse(document.getElementById("lm-state").textContent);
  let storageOk = true;
  try { const saved = localStorage.getItem(DATA_KEY); if (saved) state = JSON.parse(saved); } catch (e) { storageOk = false; }
  state.days = state.days || {};
  const GOAL_DEFAULTS = { sommeil: 8, chinois: 30, lecture: 30, guitare: 30, dessin: 30, emploi: 120, code: 30, cafe: 1, reseaux: 30, sport: 6 };
  function ensureDefaults() {
    state.settings = state.settings || {};
    state.settings.goals = Object.assign({}, GOAL_DEFAULTS, state.settings.goals || {});
  }
  ensureDefaults();
  const G = () => state.settings.goals;

  const pad = n => String(n).padStart(2, "0");
  const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const today = iso(new Date());
  let cur = (function () { try { return sessionStorage.getItem("lm-cur") || today; } catch (e) { return today; } })();
  const fmtDay = s => parse(s).toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
  const euro = v => v.toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });

  const ACTIVITES = [
    ["chinois", "Chinois"], ["lecture", "Lecture"], ["guitare", "Guitare"],
    ["dessin", "Dessin"], ["emploi", "Recherche d'emploi"], ["code", "Code de la route"]
  ];
  const CONSO = [
    ["cafe", "Cafés", 1, 1, "1 max"], ["soda", "Soda (cl)", 33, 0, "zéro"], ["cig", "Cigarettes", 1, 0, "zéro"],
    ["joints", "Joints", 1, 0, "zéro"], ["alcool", "Alcool (verres)", 1, 0, "zéro"]
  ];
  const SPORTS = ["Calisthénie", "Piscine", "Running", "Vélo", "Marche", "Repos"];

  function blank() {
    return { lever: false, sommeil: 8, etir: false, medit: false, sport: "", repas: false,
      chinois: 0, lecture: 0, guitare: 0, dessin: 0, emploi: 0, code: 0,
      cafe: 0, soda: 0, cig: 0, joints: 0, alcool: 0, reseaux: 0, humeur: 0,
      win: "", ameliorer: "", gratitude: "" };
  }
  const getDay = s => state.days[s] ? Object.assign(blank(), state.days[s]) : null;

  function score(d) {
    if (!d) return null;
    const g = G();
    const pts = [d.lever, d.sommeil >= g.sommeil, d.etir, d.medit, !!d.sport, d.chinois >= g.chinois, d.lecture >= g.lecture,
      d.guitare >= g.guitare, d.dessin >= g.dessin, d.repas, d.cafe <= g.cafe, d.soda === 0, d.cig === 0, d.joints === 0,
      d.alcool === 0, d.reseaux <= g.reseaux];
    return pts.filter(Boolean).length / 16;
  }
  function cost(d) {
    const p = state.settings.prices;
    return d.cig * p.paquet / 20 + d.joints * p.joint + d.alcool * p.verre + d.soda / 100 * p.sodaL + d.cafe * p.cafe;
  }
  function baseCost() {
    const b = state.settings.base;
    return cost({ cig: b.cig, joints: b.joints, alcool: b.alcool, soda: b.soda, cafe: b.cafe });
  }

  function markDirty() {
    try { localStorage.setItem(DATA_KEY, JSON.stringify(state)); updateSaveUi("Enregistré sur ce téléphone"); }
    catch (e) { updateSaveUi("Impossible d'enregistrer : stockage indisponible"); }
  }
  function updateSaveUi(msg) {
    const el = document.getElementById("saveState");
    el.textContent = msg || (storageOk ? "Données sur ce téléphone" : "Stockage indisponible");
    el.classList.toggle("dirty", !storageOk);
  }

  function setField(k, v) {
    const d = getDay(cur) || blank();
    d[k] = v;
    state.days[cur] = d;
    markDirty();
    renderJour();
  }

  // ---------------- Vue Jour ----------------
  function ring(p) {
    const r = 26, c = 2 * Math.PI * r, v = p == null ? 0 : p;
    const col = v >= 0.75 ? "var(--good)" : v >= 0.5 ? "var(--warn)" : "var(--accent)";
    return '<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="' + r + '" fill="none" stroke="var(--line)" stroke-width="7"/>' +
      '<circle cx="32" cy="32" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + (c * v) + " " + c + '" transform="rotate(-90 32 32)"/></svg>';
  }
  function toggle(k, on, id) {
    return '<button type="button" class="toggle" id="' + id + '" data-toggle="' + k + '" aria-pressed="' + on + '">' + (on ? "Fait" : "À faire") + "</button>";
  }
  function stepper(k, val, step, cls, unit) {
    return '<div class="stepper"><button type="button" data-step="' + k + '" data-d="-' + step + '" aria-label="Moins">−</button>' +
      '<output class="' + cls + '" id="out-' + k + '">' + val + (unit || "") + '</output>' +
      '<button type="button" data-step="' + k + '" data-d="' + step + '" aria-label="Plus">+</button></div>';
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  function renderJour() {
    const d = getDay(cur);
    const v = d || blank();
    const sc = score(d);
    const weekend = [0, 6].includes(parse(cur).getDay());
    let h = '<div class="stack">';
    h += '<div class="card datebar"><button type="button" id="prev" aria-label="Jour précédent">‹</button>' +
      '<div class="label"><strong>' + fmtDay(cur) + '</strong><small>' + (cur === today ? "Aujourd'hui" : (d ? "Journée remplie" : "Pas encore remplie")) + '</small></div>' +
      '<button type="button" id="next" aria-label="Jour suivant">›</button></div>';
    h += '<div class="card scoreline">' + ring(sc) + '<div><div class="big">' + (sc == null ? "–" : Math.round(sc * 100) + " %") + '</div>' +
      '<p>' + (sc == null ? "Commence par cocher ta première habitude." : Math.round(sc * 16) + " objectifs sur 16 atteints") + '</p></div></div>';

    h += '<div class="card"><h2>Matin</h2>' +
      '<div class="row"><div class="name">Lever à l\'heure<small>8h en mode chômage</small></div>' + toggle("lever", v.lever, "t-lever") + '</div>' +
      '<div class="row"><div class="name">Sommeil<small>objectif ' + G().sommeil + ' h</small></div>' + stepper("sommeil", v.sommeil, 0.5, v.sommeil >= G().sommeil ? "ok" : "bad", " h") + '</div>' +
      '<div class="row"><div class="name">Étirements</div>' + toggle("etir", v.etir, "t-etir") + '</div>' +
      '<div class="row"><div class="name">Méditation<small>10 min</small></div>' + toggle("medit", v.medit, "t-medit") + '</div></div>';

    h += '<div class="card"><h2>Sport</h2><div class="chips">' + SPORTS.map(s =>
      '<button type="button" class="chip" data-sport="' + s + '" aria-pressed="' + (v.sport === s) + '">' + s + '</button>').join("") + '</div></div>';

    h += '<div class="card"><h2>Activités (minutes)</h2>' + ACTIVITES.map(([k, n]) => {
      const goal = G()[k];
      const sub = (k === "emploi" || k === "code") && weekend ? "pas le week-end" : "objectif " + goal + " min";
      return '<div class="row"><div class="name">' + n + '<small>' + sub + '</small></div>' + stepper(k, v[k], k === "emploi" ? 30 : 15, v[k] >= goal ? "ok" : "", " min") + '</div>';
    }).join("") + '</div>';

    h += '<div class="card"><h2>Nutrition</h2><div class="row"><div class="name">Repas équilibrés<small>protéines + légumes à chaque repas</small></div>' + toggle("repas", v.repas, "t-repas") + '</div></div>';

    h += '<div class="card"><h2>Consommations</h2>' + CONSO.map(([k, n, step, max0, lab0]) => { const max = k === "cafe" ? G().cafe : max0; const lab = k === "cafe" ? max + " max" : lab0; return '<div class="row"><div class="name">' + n + '<small>objectif ' + lab + '</small></div>' + stepper(k, v[k], step, v[k] <= max ? "ok" : "bad") + '</div>'; }).join("") +

  function lineChart(series, opt) {

  function streak(k, test) {
    const keys = Object.keys(state.days).sort();

    for (const s of keys) {
      const d = getDay(s);
      if (prev && addDays(prev, 1) !== s) run = 0;
      run = test(d) ? run + 1 : 0;
      best = Math.max(best, run);
      prev = s;
    }
    const last = keys[keys.length - 1];
    const curRun = (last === today || last === addDays(today, -1)) ? run : 0;
    return { cur: curRun, best };
  }

      ["Soda", d => d.soda === 0], [G().cafe + " café(s) max", d => d.cafe <= G().cafe], ["Réseaux " + G().reseaux + " min max", d => d.reseaux <= G().reseaux]];

    h += '<div class="tiles"><div class="tile"><div class="k">Économisé au total</div><div class="v" style="color:var(--good)">' + euro(Math.max(0, total)) + '</div><div class="s">sur ' + keys.length + ' jour(s) suivi(s)</div></div>' +
      '<div class="tile"><div class="k">Ce mois-ci</div><div class="v">' + euro(Math.max(0, month)) + '</div><div class="s">avant : ' + euro(bc * 30) + ' par mois</div></div></div>';

  async function share(name, text, type, msg, okText) {

        await navigator.share({ files: [file], title: name });
        msg.textContent = okText; return;

    download(name, text, type); msg.textContent = okText;
  }
  function download(name, text, type) {

    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // ================= Module Budget =================
  const CAT_OUT = ["Logement", "Transport", "Abonnements", "Assurances / mutuelle", "Courses", "Sorties", "Sport", "Santé", "Permis", "Loisirs", "Cadeaux", "Divers"];
  const CAT_IN = ["Salaire", "Allocation chômage", "Autres revenus"];
  const FREQ = { mensuel: ["Mensuel", 1], trimestriel: ["Trimestriel", 3], annuel: ["Annuel", 12], hebdo: ["Hebdo", 0] };
  const ACCT = { courant: "Compte courant", epargne: "Épargne" };
  function ensureBudget() {
    const b = state.budget = state.budget || {};
    b.startDate = b.startDate || today;
    b.accounts = Object.assign({ courant: { start: 0 }, epargne: { start: 0 } }, b.accounts || {});

  ensureBudget();
  const B = () => state.budget;

  const euro2 = v => (Math.round(v * 100) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
  const monthStart = s => s.slice(0, 7) + "-01";
  const monthEnd = s => { const d = parse(monthStart(s)); d.setMonth(d.getMonth() + 1); d.setDate(0); return iso(d); };
  const addMonths = (s, n) => { const d = parse(monthStart(s)); d.setMonth(d.getMonth() + n); return iso(d); };
  const fmtMonth = s => parse(monthStart(s)).toLocaleDateString("fr-FR", { month: "long", year: "numeric" });
  const fmtShort = s => parse(s).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });

  function occurrences(r, from, to) {
    const out = [];
    if (!r.start || (r.end && r.end < from) || r.start > to) return out;
    const last = r.end && r.end < to ? r.end : to;
    if (r.freq === "hebdo") {
      for (let s = r.start, k = 0; s <= last && k < 1000; s = addDays(s, 7), k++) if (s >= from) out.push(s);
      return out;
    }
    const step = FREQ[r.freq] ? FREQ[r.freq][1] : 1;
    const day = parse(r.start).getDate();
    const st = parse(r.start);
    for (let k = 0; k < 600; k++) {
      const d = new Date(st.getFullYear(), st.getMonth() + k * step, 1);
      const dim = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, dim));
      const s = iso(d);
      if (s > last) break;
      if (s >= from && s >= r.start) out.push(s);
    }
    return out;
  }
  // Tous les mouvements (saisis + échéances générées) entre deux dates
  function movements(from, to) {
    const b = B(), list = [];
    for (const t of b.tx) if (t.date >= from && t.date <= to) list.push(t);
    for (const r of b.recurring) for (const s of occurrences(r, from, to))
      list.push({ id: r.id + "@" + s, date: s, amount: r.amount, kind: r.kind, cat: r.cat, note: r.label, account: r.account, to: r.to, fund: r.fund, recurring: true });
    return list.sort((a, c) => a.date < c.date ? -1 : a.date > c.date ? 1 : 0);
  }
  function delta(m, acct) {
    if (m.kind === "in") return m.account === acct ? m.amount : 0;
    if (m.kind === "out") return m.account === acct ? -m.amount : 0;
    if (m.kind === "transfer") return (m.account === acct ? -m.amount : 0) + ((m.to || (m.account === "courant" ? "epargne" : "courant")) === acct ? m.amount : 0);
    return 0;
  }
  function balance(acct, upTo) {
    const b = B();
    if (upTo < b.startDate) return b.accounts[acct].start;
    return movements(b.startDate, upTo).reduce((v, m) => v + delta(m, acct), b.accounts[acct].start);
  }
  function fundSaved(f, upTo) {
    return movements(B().startDate, upTo || "9999-12-31").reduce((v, m) => m.fund !== f.id ? v : m.kind === "transfer" ? v + m.amount : m.kind === "out" ? v - m.amount : v, f.start || 0);
  }
  function fundMonthly(f) {
    const before = fundSaved(f, addDays(monthStart(today), -1));
    if (f.due) {
      const due = parse(f.due), now = parse(today);
      const months = Math.max(1, (due.getFullYear() - now.getFullYear()) * 12 + due.getMonth() - now.getMonth() + 1);
      return Math.max(0, (f.target - before) / months);
    }
    return before >= f.target ? 0 : Math.min(f.monthly || 0, f.target - before);
  }
  function fundThisMonth(f) {
    return movements(monthStart(today), monthEnd(today)).reduce((v, m) => m.fund === f.id && m.kind === "transfer" ? v + m.amount : v, 0);

    const list = movements(monthStart(bMonth), monthEnd(bMonth)).reverse();
    h += '<div class="card"><h2>Mouvements du mois</h2>' + (list.length ? list.map(m => {
      const sign = m.kind === "in" ? "+" : m.kind === "out" ? "−" : "⇄";
      const label = m.kind === "transfer" ? "Virement " + (m.account === "courant" ? "vers épargne" : "vers courant") : m.cat;
      const fund = m.fund ? (B().funds.find(f => f.id === m.fund) || {}).name : "";
      return '<div class="txrow"><div class="name">' + esc(m.note || label) + '<small>' + fmtShort(m.date) + ' · ' + esc(label) + (m.recurring ? " · échéance" : "") + (m.imprevu ? " · imprévu" : "") + (fund ? " · " + esc(fund) : "") + '</small></div>' +
        '<div class="txr"><b style="color:' + (m.kind === "in" ? "var(--good)" : "var(--ink)") + '">' + sign + euro2(m.amount) + '</b>' + (m.recurring ? "" : delBtn("tx:" + m.id)) + '</div></div>';
    }).join("") : '<p class="note">Aucun mouvement ce mois-ci.</p>') + '</div>';
    return h;
  }
  let txKind = "out", recKind = "out";

  const REC_TEMPLATES = [["Salaire", "in", "Salaire"], ["Loyer", "out", "Logement"], ["Navigo", "out", "Transport"], ["Forfait mobile", "out", "Abonnements"],
    ["Internet", "out", "Abonnements"], ["Mutuelle", "out", "Assurances / mutuelle"], ["Assurance habitation", "out", "Assurances / mutuelle"], ["Virement épargne", "transfer", ""]];
  function echeancesHtml() {
    const b = B();
    const perMonth = r => r.freq === "hebdo" ? r.amount * 52 / 12 : r.amount / (FREQ[r.freq] ? FREQ[r.freq][1] : 1);
    const ins = b.recurring.filter(r => r.kind === "in").reduce((v, r) => v + perMonth(r), 0);
    const outs = b.recurring.filter(r => r.kind === "out").reduce((v, r) => v + perMonth(r), 0);
    const trs = b.recurring.filter(r => r.kind === "transfer").reduce((v, r) => v + perMonth(r), 0);
    let h = '<div class="tiles"><div class="tile"><div class="k">Revenus fixes / mois</div><div class="v" style="color:var(--good)">' + euro2(ins) + '</div></div>' +
      '<div class="tile"><div class="k">Charges fixes / mois</div><div class="v">' + euro2(outs) + '</div><div class="s">épargne auto : ' + euro2(trs) + '</div></div></div>';
    h += '<div class="card stack"><h2>Ajouter une échéance</h2><div class="chips">' + REC_TEMPLATES.map(([n, k, c], i) =>
      '<button type="button" class="chip" data-rtpl="' + i + '">' + n + '</button>').join("") + '</div>' +
      '<div class="seg3"><button type="button" data-rkind="out" aria-pressed="' + (recKind === "out") + '">Dépense</button><button type="button" data-rkind="in" aria-pressed="' + (recKind === "in") + '">Revenu</button><button type="button" data-rkind="transfer" aria-pressed="' + (recKind === "transfer") + '">Virement</button></div>' +
      '<label class="field" for="rec-label">Libellé<input type="text" id="rec-label" value="' + esc(recDraft.label || "") + '"></label>' +
      '<div class="grid2"><label class="field" for="rec-amount">Montant (€)<input type="number" inputmode="decimal" id="rec-amount" step="0.01" min="0" placeholder="0,00"></label>' +
      '<label class="field" for="rec-freq">Fréquence<select id="rec-freq">' + Object.keys(FREQ).map(k => '<option value="' + k + '">' + FREQ[k][0] + '</option>').join("") + '</select></label>' +
      '<label class="field" for="rec-start">Première date<input type="date" id="rec-start" value="' + (recDraft.start || today) + '"></label>' +
      '<label class="field" for="rec-end">Fin (facultatif)<input type="date" id="rec-end"></label>' +
      (recKind === "transfer"
        ? '<label class="field" for="rec-account">De<select id="rec-account">' + acctOptions("courant") + '</select></label><label class="field" for="rec-fund">Vers la provision<select id="rec-fund">' + fundOptions("") + '</select></label>'
        : '<label class="field" for="rec-cat">Catégorie<select id="rec-cat">' + catOptions(recKind, recDraft.cat || "") + '</select></label><label class="field" for="rec-account">Compte<select id="rec-account">' + acctOptions("courant") + '</select></label>') +
      '</div><p class="note">L\'échéance est comptée automatiquement chaque fois que sa date arrive, au même jour du mois.</p>' +
      '<button type="button" class="btn primary" id="rec-add">Ajouter l\'échéance</button></div>';
    h += '<div class="card"><h2>Mes échéances</h2>' + (b.recurring.length ? b.recurring.slice().sort((a, c) => a.kind < c.kind ? -1 : 1).map(r => {
      const next = occurrences(r, today, addDays(today, 400))[0];
      return '<div class="txrow"><div class="name">' + esc(r.label) + '<small>' + FREQ[r.freq][0] + (next ? ' · prochaine le ' + fmtShort(next) : ' · terminée') + (r.end ? ' · jusqu\'au ' + fmtShort(r.end) : '') + '</small></div>' +
        '<div class="txr"><b style="color:' + (r.kind === "in" ? "var(--good)" : "var(--ink)") + '">' + (r.kind === "in" ? "+" : r.kind === "out" ? "−" : "⇄") + euro2(r.amount) + '</b>' + delBtn("rec:" + r.id) + '</div></div>';
    }).join("") : '<p class="note">Commence par ton salaire et ton loyer avec les boutons rapides au-dessus.</p>') + '</div>';
    return h;
  }
  let recDraft = {};

  const FUND_TEMPLATES = [["Noël", 300, today.slice(0, 4) + "-12-15"], ["Fonds de secours", 1000, ""], ["Permis de conduire", 1500, ""], ["Vacances", 600, ""]];
  function provisionsHtml() {
    const b = B();
    const sav = sevrageSavings();
    let h = '<div class="card stack"><h2>Économies du sevrage</h2><p class="note" style="font-size:13px">Depuis ' + (b.lastSevrage ? "le dernier versement (" + fmtShort(b.lastSevrage) + ")" : "le début du suivi") + ', tu as économisé <b>' + euro2(sav) + '</b> sur le tabac, l\'alcool, le soda et le café.</p>' +
      (b.funds.length ? '<div class="grid2"><label class="field" for="sev-fund">Verser dans<select id="sev-fund">' + b.funds.map(f => '<option value="' + f.id + '">' + esc(f.name) + '</option>').join("") + '</select></label>' +
        '<button type="button" class="btn primary" id="sev-go" style="align-self:end"' + (sav < 0.01 ? " disabled" : "") + '>Verser ' + euro2(sav) + '</button></div>' : '<p class="note">Crée d\'abord une provision ci-dessous.</p>') + '</div>';
    h += '<div class="card"><h2>Mes provisions</h2>' + (b.funds.length ? b.funds.map(f => {
      const saved = fundSaved(f, today), m = fundMonthly(f), done = fundThisMonth(f);
      return '<div class="fund"><div class="bhead"><span><b>' + esc(f.name) + '</b>' + (f.due ? ' · pour le ' + fmtShort(f.due) : '') + '</span><b>' + euro2(saved) + ' / ' + euro2(f.target) + '</b></div>' +
        progress(f.target ? saved / f.target : 0, saved >= f.target ? "var(--good)" : "var(--warn)") +
        '<p class="note">' + (saved >= f.target ? "Objectif atteint." : "À mettre de côté ce mois-ci : " + euro2(Math.max(0, m - done)) + (done ? " (déjà " + euro2(done) + ")" : "")) + '</p>' +
        '<div class="fundact"><input type="number" inputmode="decimal" step="0.01" min="0" id="fund-amt-' + f.id + '" placeholder="' + (m > done ? (Math.round((m - done) * 100) / 100) : "Montant") + '">' +
        '<button type="button" class="btn" data-feed="' + f.id + '">Alimenter</button>' + delBtn("fund:" + f.id) + '</div></div>';
    }).join("") : '<p class="note">Une provision, c\'est de l\'argent mis de côté pour une dépense ponctuelle : Noël, permis, imprévus.</p>') + '</div>';
    h += '<div class="card stack"><h2>Nouvelle provision</h2><div class="chips">' + FUND_TEMPLATES.map(([n], i) => '<button type="button" class="chip" data-ftpl="' + i + '">' + n + '</button>').join("") + '</div>' +
      '<div class="grid2"><label class="field" for="f-name">Nom<input type="text" id="f-name" value="' + esc(fundDraft.name || "") + '"></label>' +
      '<label class="field" for="f-target">Objectif (€)<input type="number" inputmode="decimal" id="f-target" step="1" min="0" value="' + (fundDraft.target || "") + '"></label>' +
      '<label class="field" for="f-due">Pour le (facultatif)<input type="date" id="f-due" value="' + (fundDraft.due || "") + '"></label>' +
      '<label class="field" for="f-monthly">Sans date : par mois (€)<input type="number" inputmode="decimal" id="f-monthly" step="1" min="0" value="' + (fundDraft.monthly || "") + '"></label>' +
      '<label class="field" for="f-start">Déjà de côté (€)<input type="number" inputmode="decimal" id="f-start" step="1" min="0" value="0"></label></div>' +
      '<p class="note">Avec une date, l\'appli calcule le montant mensuel. Pour les imprévus, choisis un montant fixe par mois. Une dépense « payée avec une provision » est prise sur la provision, pas sur ton budget du mois.</p>' +
      '<button type="button" class="btn primary" id="f-add">Créer la provision</button></div>';
    return h;
  }
  let fundDraft = {};

  function bReglagesHtml() {
    const b = B();
    let h = '<div class="card stack"><h2>Soldes de départ</h2><label class="field" for="bs-date">Date des soldes<input type="date" id="bs-date" value="' + b.startDate + '"></label>' +
      '<div class="grid2"><label class="field" for="bs-courant">Compte courant (€)<input type="number" inputmode="decimal" step="0.01" id="bs-courant" value="' + b.accounts.courant.start + '"></label>' +
      '<label class="field" for="bs-epargne">Épargne (€)<input type="number" inputmode="decimal" step="0.01" id="bs-epargne" value="' + b.accounts.epargne.start + '"></label></div>' +
      '<p class="note">Mets les soldes affichés par ta banque à cette date. Tout ce qui arrive ensuite (échéances, mouvements) est calculé depuis là.</p></div>';
    h += '<div class="card stack"><h2>Enveloppes mensuelles (€)</h2><div class="grid2">' + CAT_OUT.map((c, i) =>
      '<label class="field" for="bb-' + i + '">' + esc(c) + '<input type="number" inputmode="decimal" step="5" min="0" id="bb-' + i + '" value="' + (b.budgets[c] || "") + '" placeholder="0"></label>').join("") + '</div>' +
      '<p class="note">Laisse vide une catégorie sans enveloppe.</p></div>';
    h += '<div class="card stack"><h2>Export</h2><p class="note">Tous les mouvements, échéances comprises, au format CSV pour Excel. La sauvegarde complète (Réglages de l\'appli) contient aussi le budget.</p>' +
      '<button type="button" class="btn" id="b-export">Exporter les mouvements (CSV)</button><p class="note" id="bMsg"></p></div>';
    return h;
  }

  function numVal(id) { const el = document.getElementById(id); return el ? parseFloat(String(el.value).replace(",", ".")) : NaN; }
  function val(id) { const el = document.getElementById(id); return el ? el.value : ""; }
  function bSave(msg) { markDirty(); bMsg = msg || ""; renderBudget(); }

  document.getElementById("view-budget").addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    const b = B(), d = t.dataset;
    if (d.del == null && confirmDel) confirmDel = null;
    if (d.bseg) { bSeg = d.bseg; confirmDel = null; renderBudget(); return; }
    if (d.bmonth) { bMonth = addMonths(bMonth, Number(d.bmonth)); renderBudget(); return; }
    if (d.tkind) { txKind = d.tkind; renderBudget(); return; }
    if (d.rkind) { recKind = d.rkind; renderBudget(); return; }
    if (d.rtpl != null) { const [n, k, c] = REC_TEMPLATES[Number(d.rtpl)]; recKind = k; recDraft = { label: n, cat: c }; renderBudget(); const a = document.getElementById("rec-amount"); if (a) a.focus(); return; }
    if (d.ftpl != null) { const [n, tg, due] = FUND_TEMPLATES[Number(d.ftpl)]; fundDraft = { name: n, target: tg, due, monthly: due ? "" : Math.round(tg / 10) }; renderBudget(); return; }
    if (d.del) {
      if (confirmDel !== d.del) { confirmDel = d.del; renderBudget(); return; }
      const [type, id] = d.del.split(":");
      if (type === "tx") b.tx = b.tx.filter(x => x.id !== id);
      if (type === "rec") b.recurring = b.recurring.filter(x => x.id !== id);
      if (type === "fund") { b.funds = b.funds.filter(x => x.id !== id); b.tx.forEach(x => { if (x.fund === id) delete x.fund; }); b.recurring.forEach(x => { if (x.fund === id) delete x.fund; }); }
      confirmDel = null; bSave("Supprimé."); return;
    }
    if (t.id === "tx-add") {
      const amount = numVal("tx-amount");
      if (!(amount > 0)) { bMsg = "Indique un montant supérieur à 0."; renderBudget(); return; }
      const tx = { id: uid(), date: val("tx-date") || today, amount, kind: txKind, account: val("tx-account") || "courant", note: val("tx-note").trim() };
      if (txKind !== "transfer") tx.cat = val("tx-cat");
      if (txKind === "transfer") { tx.to = tx.account === "courant" ? "epargne" : "courant"; tx.cat = "Virement"; }
      const fund = val("tx-fund"); if (fund) { tx.fund = fund; if (txKind === "out") tx.account = "epargne"; if (txKind === "transfer") { tx.account = "courant"; tx.to = "epargne"; } }
      if (txKind === "out" && document.getElementById("tx-imprevu") && document.getElementById("tx-imprevu").checked) tx.imprevu = true;
      b.tx.push(tx); bMonth = monthStart(tx.date); bSave("Mouvement ajouté : " + euro2(amount) + "."); return;
    }
    if (t.id === "rec-add") {
      const amount = numVal("rec-amount"), label = val("rec-label").trim();
      if (!(amount > 0) || !label) { bMsg = "Indique un libellé et un montant."; renderBudget(); return; }
      const r = { id: uid(), label, amount, kind: recKind, freq: val("rec-freq") || "mensuel", start: val("rec-start") || today, end: val("rec-end") || "", account: val("rec-account") || "courant" };
      if (recKind === "transfer") { r.to = r.account === "courant" ? "epargne" : "courant"; r.cat = "Virement"; const f = val("rec-fund"); if (f) { r.fund = f; r.account = "courant"; r.to = "epargne"; } }
      else r.cat = val("rec-cat");
      b.recurring.push(r); recDraft = {}; bSave("Échéance ajoutée : " + label + "."); return;
    }
    if (t.id === "f-add") {
      const name = val("f-name").trim(), target = numVal("f-target");
      if (!name || !(target > 0)) { bMsg = "Indique un nom et un objectif."; renderBudget(); return; }
      b.funds.push({ id: uid(), name, target, due: val("f-due") || "", monthly: numVal("f-monthly") || 0, start: numVal("f-start") || 0 });
      fundDraft = {}; bSave("Provision créée : " + name + "."); return;
    }
    if (d.feed) {
      const f = b.funds.find(x => x.id === d.feed); if (!f) return;
      let amount = numVal("fund-amt-" + f.id);
      if (!(amount > 0)) amount = Math.round(Math.max(0, fundMonthly(f) - fundThisMonth(f)) * 100) / 100;
      if (!(amount > 0)) { bMsg = "Indique le montant à mettre de côté."; renderBudget(); return; }
      b.tx.push({ id: uid(), date: today, amount, kind: "transfer", account: "courant", to: "epargne", fund: f.id, cat: "Virement", note: "Provision " + f.name });
      bSave(euro2(amount) + " mis de côté pour " + f.name + "."); return;
    }
    if (t.id === "sev-go") {
      const amount = Math.round(sevrageSavings() * 100) / 100, f = val("sev-fund");
      if (!(amount > 0) || !f) return;
      b.tx.push({ id: uid(), date: today, amount, kind: "transfer", account: "courant", to: "epargne", fund: f, cat: "Virement", note: "Économies du sevrage" });
      b.lastSevrage = today; bSave(euro2(amount) + " versés depuis tes économies du sevrage."); return;
    }
    if (t.id === "b-export") {
      const rows = [["date", "type", "categorie", "libelle", "montant", "compte", "provision", "imprevu", "echeance"].join(";")];
      const q = v => { const s = String(v == null ? "" : v); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
      for (const m of movements(b.startDate, addDays(today, 0))) {
        const kind = m.kind === "in" ? "revenu" : m.kind === "out" ? "dépense" : "virement";
        const amt = (m.kind === "out" ? -m.amount : m.amount).toFixed(2).replace(".", ",");
        const fund = m.fund ? (b.funds.find(f => f.id === m.fund) || {}).name : "";
        rows.push([m.date, kind, q(m.cat), q(m.note), amt, ACCT[m.account] || m.account, q(fund || ""), m.imprevu ? "x" : "", m.recurring ? "x" : ""].join(";"));
      }
      share("life-maxxxing-budget-" + today + ".csv", "﻿" + rows.join("\n"), "text/csv", document.getElementById("bMsg"), "Export créé : ouvre-le avec Excel.");
    }
  });
  document.getElementById("view-budget").addEventListener("change", e => {
    const t = e.target, b = B(); if (!t.id) return;
    if (t.id === "bs-date") { b.startDate = t.value || today; markDirty(); }
    else if (t.id === "bs-courant" || t.id === "bs-epargne") { b.accounts[t.id.slice(3)].start = parseFloat(String(t.value).replace(",", ".")) || 0; markDirty(); }
    else if (t.id.startsWith("bb-")) { const c = CAT_OUT[Number(t.id.slice(3))]; const v = parseFloat(String(t.value).replace(",", ".")); if (v > 0) b.budgets[c] = v; else delete b.budgets[c]; markDirty(); }
  });

  // ---------------- Navigation ----------------
  const VIEWS = ["jour", "semaine", "stats", "sevrage", "budget", "reglages"];
  function show() {
    const v = VIEWS.includes(location.hash.slice(1)) ? location.hash.slice(1) : "jour";
    VIEWS.forEach(n => { document.getElementById("view-" + n).hidden = n !== v; });
    document.querySelectorAll("nav.tabs a").forEach(a => a.setAttribute("aria-current", a.dataset.view === (v === "sevrage" ? "stats" : v) ? "page" : "false"));
    ({ jour: renderJour, semaine: renderSemaine, stats: renderStats, sevrage: renderSevrage, budget: renderBudget, reglages: renderReglages })[v]();
  }
  window.addEventListener("hashchange", show);
  show();
  updateSaveUi();

  if ("serviceWorker" in navigator && location.protocol === "https:") {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
</script>
</body>
</html>
